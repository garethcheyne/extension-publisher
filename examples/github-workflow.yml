# Example for an extension repository on GitHub. Copy to .github/workflows/extension.yml.
#
#   every push / PR   build, check the listing, keep the zip as an artifact
#   tag v*            ...then publish that same zip to both stores, after approval
#
# One-time setup (see the toolkit README):
#   - environment "extension-stores" with required reviewers, holding the secrets
#     CHROME_SERVICE_ACCOUNT_JSON, EDGE_CLIENT_ID, EDGE_API_KEY

name: Extension
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.pack.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
      - id: pack
        uses: YOUR-ORG/extension-publisher@v1
        with:
          mode: Package
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: ${{ steps.pack.outputs.zip }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    environment: extension-stores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: artifact
      - id: zip
        shell: bash
        run: echo "path=$(ls artifact/*.zip | head -1)" >> "$GITHUB_OUTPUT"
      - uses: YOUR-ORG/extension-publisher@v1
        with:
          mode: Publish
          zip-path: ${{ steps.zip.outputs.path }}
        env:
          CHROME_SERVICE_ACCOUNT_JSON: ${{ secrets.CHROME_SERVICE_ACCOUNT_JSON }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
